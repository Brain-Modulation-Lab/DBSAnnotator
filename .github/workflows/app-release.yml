name: App CI/CD

# The Flutter app's CI/CD. The app lives at the repo root, so every `run:`
# step executes there with no working-directory. Independent of the frozen Qt
# app's Python CI in ci.yml (which is scoped to app_qt/).
#
# On PRs touching the Dart tree it runs tests + a build check; on `app-v*` tags
# it ships Android (APK -> GitHub Release) and iOS (-> TestFlight, when the
# Apple secrets are configured).
on:
  push:
    tags:
      - "app-v*"
  pull_request:
    paths:
      # The Flutter app IS the repo root now, so the filter is what it is NOT.
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "pubspec.yaml"
      - "android/**"
      - "ios/**"
      - "linux/**"
      - "macos/**"
      - "windows/**"
      - "schema/**"
      - ".github/workflows/app-release.yml"
  workflow_dispatch:

permissions:
  contents: write


jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Desktop builds. These are compile-level proof that the report/export path
  # builds on every target we ship; the delivery step (share sheet vs Save-As)
  # still needs a manual smoke test per OS.
  linux:
    name: Linux
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: build/linux/x64/release/bundle
          if-no-files-found: error

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: build/windows/x64/runner/Release
          if-no-files-found: error

  macos:
    name: macOS
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      # Unsigned: proves it compiles and links. Signing/notarisation is a
      # release concern, not a CI-correctness one.
      - run: flutter build macos --release

  android:
    name: Android (APK + AAB)
    needs: test
    runs-on: ubuntu-latest
    # Job-level env so step `if:` conditions can read it (step-level env is not
    # visible to that step's own `if:`).
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable


      - name: Decode signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Build APK + AAB
        run: |
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true

  ios:
    name: iOS (TestFlight)
    needs: test
    runs-on: macos-latest
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable


      # Dry-run build (no signing) — always runs so PRs verify iOS compiles.
      - name: Build iOS (no codesign)
        run: |
          flutter pub get
          flutter build ios --release --no-codesign

      # Signed IPA + TestFlight upload only on a tag and only when Apple
      # secrets are present (App Store Connect API key). Wire fastlane pilot /
      # xcrun altool here once the Apple Developer account (nonprofit fee
      # waiver) is set up.
      - name: Upload to TestFlight (fastlane)
        if: ${{ startsWith(github.ref, 'refs/tags/app-v') && env.APP_STORE_CONNECT_KEY_ID != '' }}
        run: |
          if [ -f ios/fastlane/Fastfile ]; then
            cd ios && fastlane beta
          else
            echo "Apple secrets are set but ios/fastlane/Fastfile is missing."
            echo "See MOBILE_RELEASE.md section 3 to add it."
            exit 1
          fi
