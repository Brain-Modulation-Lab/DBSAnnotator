name: App CI/CD

# The Flutter app's CI/CD, and the only workflow in this repository. The app
# lives at the repo root, so every step runs there with no working-directory.
#
# On PRs touching the Dart tree it runs tests + a build check; on `app-v*` tags
# it ships Android (APK -> GitHub Release) and iOS (-> TestFlight, when the
# Apple secrets are configured).
on:
  push:
    tags:
      - "app-v*"
  pull_request:
    paths:
      # The Flutter app IS the repo root now, so the filter is what it is NOT.
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "pubspec.yaml"
      - "android/**"
      - "ios/**"
      - "linux/**"
      - "macos/**"
      - "windows/**"
      - "schema/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: write


jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Desktop builds. These are compile-level proof that the report/export path
  # builds on every target we ship; the delivery step (share sheet vs Save-As)
  # still needs a manual smoke test per OS.
  linux:
    name: Linux
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: build/linux/x64/release/bundle
          if-no-files-found: error

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    # Job-level env so step `if:` conditions can read it (a step-level env is
    # not visible to that step's own `if:`) - same reason as the android job.
    env:
      WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: build/windows/x64/runner/Release
          if-no-files-found: error

      # ---- MSIX, on tags only -------------------------------------------
      # PRs keep costing just a compile. `windows-latest` already ships the
      # Windows SDK, so MakeAppx/SignTool need no install step.
      #
      # The version comes from the TAG, not the pubspec: a tag is what actually
      # identifies a release, and MSIX needs a fourth component the pubspec
      # grammar has no room for. `app-v0.5.0` -> `0.5.0.0`.
      - name: Derive the MSIX version from the tag
        if: startsWith(github.ref, 'refs/tags/app-v')
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#app-v}"
          # Tolerate a `-rc` suffix on dry-run tags; MSIX takes digits only.
          v="${v%%-*}"
          echo "MSIX_VERSION=${v}.0" >> "$GITHUB_ENV"

      - name: Decode signing certificate
        if: startsWith(github.ref, 'refs/tags/app-v') && env.WINDOWS_CERT_BASE64 != ''
        shell: bash
        run: echo "$WINDOWS_CERT_BASE64" | base64 -d > signing.pfx

      # Signed when a certificate secret exists (installable by anyone who
      # trusts it), otherwise the Store-mode package: unsigned on purpose,
      # because Microsoft re-signs MSIX submissions itself after certification.
      #
      # `--store` needs the Partner Center identity, which is deliberately not
      # in the repo. `publisher` is unset in pubspec.yaml, so a store build
      # FAILS HERE with a message naming the exact dashboard page to copy it
      # from - which is the behaviour we want: better a red tag build than a
      # package rejected at upload. Set the three repo variables below once the
      # app name is reserved.
      - name: Build MSIX
        if: startsWith(github.ref, 'refs/tags/app-v')
        shell: bash
        run: |
          args=(--version "$MSIX_VERSION")
          if [ -n "$WINDOWS_CERT_BASE64" ]; then
            args+=(--certificate-path signing.pfx
                   --certificate-password "$WINDOWS_CERT_PASSWORD"
                   --install-certificate false)
          else
            args+=(--store)
          fi
          if [ -n "${{ vars.MSIX_IDENTITY_NAME }}" ]; then
            args+=(--identity-name "${{ vars.MSIX_IDENTITY_NAME }}"
                   --publisher "${{ vars.MSIX_PUBLISHER }}"
                   --publisher-display-name "${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}")
          fi
          dart run msix:create "${args[@]}"

      - name: Shred the certificate
        # `always()` so a failed MSIX build cannot leave a private key on disk
        # for later steps or a cached workspace.
        if: always() && startsWith(github.ref, 'refs/tags/app-v')
        shell: bash
        run: rm -f signing.pfx

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/app-v')
        with:
          name: windows-msix
          path: build/windows/msix/*.msix
          if-no-files-found: error

      - name: Attach MSIX to GitHub Release
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/windows/msix/*.msix
          fail_on_unmatched_files: true

  macos:
    name: macOS
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      # Unsigned: proves it compiles and links. Signing/notarisation is a
      # release concern, not a CI-correctness one.
      - run: flutter build macos --release

  android:
    name: Android (APK + AAB)
    needs: test
    runs-on: ubuntu-latest
    # Job-level env so step `if:` conditions can read it (step-level env is not
    # visible to that step's own `if:`).
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable


      - name: Decode signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Build APK + AAB
        run: |
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true

  ios:
    name: iOS (TestFlight)
    needs: test
    runs-on: macos-latest
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable


      # Dry-run build (no signing) — always runs so PRs verify iOS compiles.
      - name: Build iOS (no codesign)
        run: |
          flutter pub get
          flutter build ios --release --no-codesign

      # Signed IPA + TestFlight upload only on a tag and only when Apple
      # secrets are present (App Store Connect API key). Wire fastlane pilot /
      # xcrun altool here once the Apple Developer account (nonprofit fee
      # waiver) is set up.
      - name: Upload to TestFlight (fastlane)
        if: ${{ startsWith(github.ref, 'refs/tags/app-v') && env.APP_STORE_CONNECT_KEY_ID != '' }}
        run: |
          if [ -f ios/fastlane/Fastfile ]; then
            cd ios && fastlane beta
          else
            echo "Apple secrets are set but ios/fastlane/Fastfile is missing."
            echo "See MOBILE_RELEASE.md section 3 to add it."
            exit 1
          fi
