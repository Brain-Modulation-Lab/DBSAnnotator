name: Docs Screenshots

on:
  workflow_dispatch:

defaults:
  run:
    # The Python project is app_qt/. `uv` walks UP for a pyproject.toml, so every
    # step needs its CWD inside the project. Affects `run:` steps ONLY — `uses:`
    # inputs like `path:` stay workspace-relative and are prefixed by hand.
    working-directory: app_qt

jobs:
  generate-doc-screenshots:
    name: Generate docs UI screenshots
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.12"
          enable-cache: true

      # PySide6 needs EGL/XCB deps even with QT_QPA_PLATFORM=offscreen.
      - name: Install Qt EGL/XCB dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            fontconfig \
            fonts-dejavu-core

      - name: Sync dev dependencies
        run: |
          uv sync --locked --dev

      - name: Generate screenshot artifacts
        env:
          QT_QPA_PLATFORM: offscreen
          DOCS_SCREENSHOT_DIR: docs/_static
          # Offscreen on Linux: theme helper swaps QSS to DejaVu Sans (see screenshot_helpers).
        run: |
          uv run pytest tests/docs/test_docs_screenshots.py -m docs_screenshot

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-screenshots-${{ github.sha }}
          path: app_qt/docs/_static
          if-no-files-found: error
