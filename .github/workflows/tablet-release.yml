name: Tablet CI/CD

# Independent of the desktop Python CI. On PRs touching tablet/** it runs
# tests + a build check; on `tablet-v*` tags it ships Android (APK -> GitHub
# Release) and iOS (-> TestFlight, when Apple secrets are configured).
on:
  push:
    tags:
      - "tablet-v*"
  pull_request:
    paths:
      - "tablet/**"
      - "schema/**"
      - ".github/workflows/tablet-release.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: tablet

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android (APK + AAB)
    needs: test
    runs-on: ubuntu-latest
    # Job-level env so step `if:` conditions can read it (step-level env is not
    # visible to that step's own `if:`).
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Generate the android/ host project around the committed lib/pubspec.
      - name: Generate Android host project
        run: flutter create --platforms=android --org ch.wysscenter --project-name dbs_annotator_tablet .

      - name: Decode signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Build APK + AAB
        run: |
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            tablet/build/app/outputs/flutter-apk/app-release.apk
            tablet/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/tablet-v')
        uses: softprops/action-gh-release@v2
        with:
          files: tablet/build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true

  ios:
    name: iOS (TestFlight)
    needs: test
    runs-on: macos-latest
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate iOS host project
        run: flutter create --platforms=ios --org ch.wysscenter --project-name dbs_annotator_tablet .

      # Dry-run build (no signing) — always runs so PRs verify iOS compiles.
      - name: Build iOS (no codesign)
        run: |
          flutter pub get
          flutter build ios --release --no-codesign

      # Signed IPA + TestFlight upload only on a tag and only when Apple
      # secrets are present (App Store Connect API key). Wire fastlane pilot /
      # xcrun altool here once the Apple Developer account (nonprofit fee
      # waiver) is set up.
      - name: Upload to TestFlight
        if: ${{ startsWith(github.ref, 'refs/tags/tablet-v') && env.APP_STORE_CONNECT_KEY_ID != '' }}
        run: |
          echo "Configure fastlane pilot or xcrun altool here once Apple secrets exist."
          echo "Placeholder step: signed IPA build + TestFlight upload."
