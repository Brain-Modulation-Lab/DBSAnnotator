# Read the Docs builds the documentation for the app at the repo root.
#
# The app is written in Dart and nothing in docs/conf.py imports it, so the
# build needs four Sphinx wheels and nothing else: no project install, no system
# libraries. Flutter is never installed either — screenshots are generated from
# widget tests and committed, because RTD cannot run a ~1 GB SDK inside its
# build limits.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

python:
  install:
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py
  # Warnings are errors. There is no `suppress_warnings` in conf.py to relax
  # this: every screenshot is committed, so a missing image is a real fault.
  fail_on_warning: true
