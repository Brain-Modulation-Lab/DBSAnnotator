# Read the Docs builds the documentation for the Flutter app at the repo root.
#
# This got dramatically simpler when the Qt app was frozen into app_qt/. The old
# config had to install a Python project with uv (plus a pip/uv bootstrap in
# pre_install), and needed apt_packages for libegl1/libgl1/libxkbcommon0/
# libdbus-1-3 because Sphinx autosummary imported PySide6 transitively while
# documenting the Qt modules.
#
# The app documented here is written in Dart and nothing in docs/conf.py imports
# it, so the build needs four Sphinx wheels and nothing else. Flutter is never
# installed: screenshots are generated from widget tests and committed, because
# RTD cannot run a ~1 GB SDK inside its build limits.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

python:
  install:
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py
  # Warnings are errors. There is no `suppress_warnings` in conf.py to relax
  # this: every screenshot is committed, so a missing image is a real fault.
  fail_on_warning: true
