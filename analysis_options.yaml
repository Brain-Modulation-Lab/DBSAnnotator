# The Flutter app is the repo root, so the analyzer's scope is the whole
# repository — hence the exclusions cover the platform runners and build output.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: true
    prefer_final_locals: true
