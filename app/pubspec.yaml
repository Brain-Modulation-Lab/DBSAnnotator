name: dbs_annotator
description: "DBS Annotator companion app (offline, TSV-compatible with the desktop app)."
publish_to: "none"

# Mirrors the desktop SemVer; the +N build number is bumped per release.
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # TSV read/write with RFC4180 quoting so fields with embedded newlines
  # (notes, newline-separated scale_name/scale_value) round-trip like Python csv.
  csv: ^6.0.0
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  share_plus: ^10.1.2
  # Report export: native PDF, no MS Word needed.
  #
  # Two chart-related packages are deliberately NOT dependencies:
  # `printing` (nothing imports it, and it drags a pdfium download plus
  # gtk+-unix-print into every Linux/Windows desktop build) and `fl_chart`
  # (every chart, on screen and in both report formats, is drawn by
  # ui/scales_chart_painter.dart + ui/chart_primitives.dart, so screen and print
  # cannot disagree).
  pdf: ^3.11.1
  # Desktop window sizing + title (Linux/Windows/macOS). No-op on mobile.
  window_manager: ^0.4.2
  # Word (.docx) export = zipping OOXML parts (already transitive via pdf).
  archive: ^4.0.0
  # Primary-display work area, to clamp the window to the screen (transitive via
  # window_manager; pinned direct so main.dart can import it).
  screen_retriever: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # App icon generation (run: dart run flutter_launcher_icons). See MOBILE_RELEASE.md.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  # Machine-readable contracts generated by the desktop app. The build/CI
  # copies repo-root schema/*.json into app/assets/schema/ before building.
  assets:
    - assets/schema/
    # Optional Unicode report fonts (IBMPlexSans-Regular.ttf / -Bold.ttf, OFL):
    # drop the TTFs here; reports fall back to Helvetica (ASCII-only) when
    # absent. See lib/report/report_fonts.dart and MOBILE_RELEASE.md.
    - assets/fonts/
    # The app mark, shown in the AppBar and the About dialog, and bundled so the
    # Linux runner can set the window icon (Flutter's Linux template sets none).
    - assets/icon/

# App launcher icon = the desktop Qt app's mark
# (icons/logosimple/logosimple.iconset/icon_512x512@2x.png -> assets/icon/app_icon.png).
# Regenerate all platform icons with `dart run flutter_launcher_icons`.
# NOTE: this tool has no Linux support — the Linux window icon is set by hand in
# linux/runner/my_application.cc from the bundled asset above.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  # Android adaptive icons composite 108dp and show only the inner 72dp (66%).
  # The mark fills ~94% of its canvas, so it would be clipped at the corners by
  # circular and squircle launcher masks; the foreground below re-centres it at
  # 60% on a transparent canvas, over a white background.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_adaptive_foreground.png"
  ios: true
  # iOS forbids alpha in app icons, so flatten onto white.
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
