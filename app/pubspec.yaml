name: dbs_annotator
description: "DBS Annotator companion app (offline, TSV-compatible with the desktop app)."
publish_to: "none"

# Mirrors the desktop SemVer; the +N build number is bumped per release.
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # TSV read/write with RFC4180 quoting so fields with embedded newlines
  # (notes, newline-separated scale_name/scale_value) round-trip like Python csv.
  csv: ^6.0.0
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  share_plus: ^10.1.2
  # Report export: native PDF (no MS Word needed) and the on-screen timeline
  # chart. `printing` is deliberately NOT a dependency: nothing imports it, and
  # it drags a pdfium download plus gtk+-unix-print into every Linux/Windows
  # desktop build.
  pdf: ^3.11.1
  fl_chart: ^0.69.0
  # Desktop window sizing + title (Linux/Windows/macOS). No-op on mobile.
  window_manager: ^0.4.2
  # Word (.docx) export = zipping OOXML parts (already transitive via pdf).
  archive: ^4.0.0
  # Primary-display work area, to clamp the window to the screen (transitive via
  # window_manager; pinned direct so main.dart can import it).
  screen_retriever: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # App icon generation (run: dart run flutter_launcher_icons). See MOBILE_RELEASE.md.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  # Machine-readable contracts generated by the desktop app. The build/CI
  # copies repo-root schema/*.json into app/assets/schema/ before building.
  assets:
    - assets/schema/
    # Optional Unicode report fonts (IBMPlexSans-Regular.ttf / -Bold.ttf, OFL):
    # drop the TTFs here; reports fall back to Helvetica (ASCII-only) when
    # absent. See lib/report/report_fonts.dart and MOBILE_RELEASE.md.
    - assets/fonts/

# App launcher icon = the desktop Qt app's icon
# (icons/logosimple/logosimple.png, copied to assets/icon/app_icon.png).
# Regenerate all platform icons with `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
