name: dbs_annotator_tablet
description: "Tablet companion for DBS Annotator (offline, TSV-compatible with the desktop app)."
publish_to: "none"

# Mirrors the desktop SemVer; the +N build number is bumped per release.
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # TSV read/write with RFC4180 quoting so fields with embedded newlines
  # (notes, newline-separated scale_name/scale_value) round-trip like Python csv.
  csv: ^6.0.0
  intl: ^0.19.0
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  share_plus: ^10.1.2
  # v1 report export (native PDF, no MS Word needed) + timeline chart.
  pdf: ^3.11.1
  printing: ^5.13.4
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Machine-readable contracts generated by the desktop app. The build/CI
  # copies repo-root schema/*.json into tablet/assets/schema/ before building.
  assets:
    - assets/schema/
